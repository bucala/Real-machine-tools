name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testy
        run: npm test
      - name: Build
        run: npm run build
      - name: Zostavený public/ je aktuálny
        run: |
          if ! git diff --quiet -- public || [ -n "$(git status --porcelain -- public)" ]; then
            echo "::error::Priečinok public/ nezodpovedá zdrojom – spusti 'npm run build' a commitni výsledok."
            git status --short -- public
            exit 1
          fi

  # Nasadenie na Cloudflare Workers: po každom pushi (zlúčení) do main, ak prešli kontroly.
  # Potrebuje tajomstvá repozitára CLOUDFLARE_API_TOKEN a CLOUDFLARE_ACCOUNT_ID; bez nich sa krok len preskočí.
  deploy:
    name: Nasadenie na Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://real-machine-tools.marcel-bucala.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chýbajú prístupové údaje Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Nasadenie preskočené – v Settings → Secrets and variables → Actions doplň CLOUDFLARE_API_TOKEN a CLOUDFLARE_ACCOUNT_ID."
      - name: Nasadenie (wrangler deploy)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
