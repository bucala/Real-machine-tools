function DrillSimulator({ onBack }) {
  const mountRef = useRef(null), layerRef = useRef(null), tipRef = useRef(null);
  const init = { running: false, power: true, manual: false, rpm: 710, quill: 0, table: 450, u: 0, v: 0, bit: 10, timeScale: 1, bL: 180, bW: 120, bT: 25 };
  const { ctl, ui, setUi, set, selected, selectPart, apiRef } = useMachine(init);
  const [tele, setTele] = useState({ rpm: 0, quill: 0, table: 450, depth: 0, vc: 0, msg: null, drilling: false, holes: 0 });

  useEffect(() => {
    const mount = mountRef.current, layer = layerRef.current, tipEl = tipRef.current;
    const c = ctl.current;
    const { SX, SZ, NOSE, T0, PAR, CH, BL } = DRILL;
    const wk = { PT: 0.25, PW: 1.8, PD: 1.2 };
    const { renderer, scene, camera, dispose: disposeStage } = createStage(mount);
    const dom = renderer.domElement;
    const M = {
      ...baseMats(0x52c2a5, 0x3da98c, 0x2c7d68),
      col: std(0x5e5953, 0.42, 0.6), motor: std(0x7d8389, 0.5, 0.55), plate: std(0x737980, 0.42, 0.62),
      hole: std(0x0b0c0d, 0.9, 0.1), bit: std(0x2f3236, 0.32, 0.8), chip: std(0xa6adb4, 0.3, 0.85),
    };
    const { add, box, cylX, cylY, cylZ, ball, lever, hitProxy, pivotLever, detents, crank, face } = makeKit(M);
    const root = new THREE.Group(); scene.add(root);
    const G = {};
    const grp = (k, parent = root) => { const g = new THREE.Group(); g.userData.part = k; parent.add(g); G[k] = g; return g; };
    const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

    // ---------- základová doska ----------
    const base = grp('podstavec');
    box(base, -2.25, 2.25, 0, 0.12, -3.55, 2.55, M.greenDark);
    box(base, -2.1, 2.1, 0.12, 0.42, -3.4, 2.4, M.green);
    box(base, -1.75, 1.75, 0.42, 0.5, -1.7, 2.0, M.col);
    [-1.25, -0.55, 0.15, 0.85, 1.55].forEach((z) => box(base, -1.75, 1.75, 0.49, 0.505, z - 0.06, z + 0.06, M.black));
    box(base, -2.1, 2.1, 0.42, 0.62, -3.4, -1.7, M.green);
    cylY(base, 0.72, 0.6, 0.62, 0.95, 0, -2.4, M.green, 28);
    [[-1.95, -3.25], [1.95, -3.25], [-1.95, 2.25], [1.95, 2.25]].forEach(([x, z]) => cylY(base, 0.12, 0.12, 0.12, 0.2, x, z, M.steelDark, 12));

    // ---------- stĺp ----------
    const colG = grp('stlp');
    cylY(colG, 0.42, 0.42, 0.95, 12.0, 0, -2.4, M.col, 32);
    box(colG, 0.34, 0.5, 1.4, 11.4, -2.48, -2.32, M.steelDark);        // hrebeň
    cylY(colG, 0.56, 0.56, 11.5, 12.0, 0, -2.4, M.green, 28);

    // ---------- vŕtacia hlava ----------
    const head = grp('hlava');
    box(head, -1.5, 1.3, 12.0, 15.2, -3.3, 1.2, M.green);
    box(head, -1.62, 1.42, 15.2, 15.6, -3.45, 1.35, M.green);
    cylY(head, 0.45, 0.45, 11.4, 12.0, SX, SZ, M.green, 28);            // puzdro pinoly
    box(head, -1.2, -0.45, 14.0, 14.55, 1.2, 1.22, M.panel);            // výrobný štítok
    box(head, 0.2, 1.0, 12.7, 14.7, 1.2, 1.24, M.panel);                // ovládací panel
    ball(head, 0.07, 0.38, 14.45, 1.26, M.lamp);
    const pbtn = (x, y, m) => { const g = new THREE.Group(); g.position.set(x, y, 1.24); head.add(g); cylZ(g, 0.1, 0.1, 0, 0.07, 0, 0, m, 20); hitProxy(g, 0.15, 0, 0, 0.05); return g; };
    const btnStart = pbtn(0.42, 14.0, M.btnGreen), btnStop = pbtn(0.78, 14.0, M.red);
    box(head, 0.3, 0.9, 12.85, 13.5, 1.24, 1.25, M.yellow);
    const mainSwitch = new THREE.Group(); mainSwitch.position.set(0.6, 13.17, 1.25); head.add(mainSwitch);
    cylZ(mainSwitch, 0.17, 0.17, 0, 0.06, 0, 0, M.black, 24);
    box(mainSwitch, -0.22, 0.22, -0.045, 0.045, 0.06, 0.17, M.red);
    // priečna kľuka posuvu pinoly na ľavom boku
    const cfc = face(head, -1.5, 13.1, SZ, -Math.PI / 2);
    const capstan = new THREE.Group(); cfc.add(capstan);
    cylZ(capstan, 0.25, 0.25, 0, 0.28, 0, 0, M.steelDark, 24);
    cylZ(capstan, 0.1, 0.1, 0.28, 0.42, 0, 0, M.steel, 16);
    for (let k = 0; k < 3; k++) {
      const arm = new THREE.Group(); arm.rotation.z = k * TAU / 3 + Math.PI / 2; capstan.add(arm);
      cylX(arm, 0.05, 0.04, 0.2, 1.25, 0, 0.18, M.steel, 10); ball(arm, 0.13, 1.3, 0, 0.18, M.black);
    }
    // páky otáčok na pravom boku
    const sf = face(head, 1.3, 0, 0.5, Math.PI / 2);
    cylZ(sf, 0.26, 0.22, 0, 0.15, -0.5, 14.55, M.black, 24); cylZ(sf, 0.26, 0.22, 0, 0.15, 0.25, 14.55, M.black, 24);
    detents(sf, -0.5, 14.55, 0.15, 0.17, D2_ANG, 0.025); detents(sf, 0.25, 14.55, 0.15, 0.17, D4_ANG, 0.022);
    const levR = pivotLever(sf, -0.5, 14.55, 0.15, 0.42, 1.15), levS = pivotLever(sf, 0.25, 14.55, 0.15, 0.42, 1.15);

    // ---------- motor ----------
    const mot = grp('motor');
    cylX(mot, 0.62, 0.62, 1.3, 2.5, 13.55, -0.9, M.motor, 32);
    for (let k = 0; k < 12; k++) {
      const a = k * TAU / 12;
      const f = add(mot, new THREE.BoxGeometry(1.1, 0.12, 0.06), M.motor, 1.9, 13.55 + Math.sin(a) * 0.66, -0.9 + Math.cos(a) * 0.66);
      f.rotation.x = -a;
    }
    cylX(mot, 0.56, 0.5, 2.5, 2.72, 13.55, -0.9, M.motor, 28);
    box(mot, 1.55, 2.15, 14.15, 14.5, -1.25, -0.55, M.motor);

    // ---------- pinola, skľučovadlo, vrták ----------
    const spG = grp('vreteno'); spG.position.set(SX, NOSE, SZ);
    cylY(spG, 0.3, 0.3, 0, 0.9, 0, 0, M.steel, 28);
    const rot = new THREE.Group(); spG.add(rot);
    cylY(rot, 0.22, 0.22, -0.25, 0, 0, 0, M.steelDark, 24);
    cylY(rot, 0.3, 0.26, -0.85, -0.25, 0, 0, M.steel, 28);
    cylY(rot, 0.31, 0.31, -0.62, -0.5, 0, 0, M.steelDark, 28);
    cylY(rot, 0.16, 0.12, -CH, -0.85, 0, 0, M.steelDark, 20);
    const bitG = new THREE.Group(); rot.add(bitG);
    const bitR = (d = st.bit) => d / 200;
    const buildBit = (d) => {
      while (bitG.children.length) { const o = bitG.children[0]; bitG.remove(o); o.geometry.dispose(); }
      const r = bitR(d);
      cylY(bitG, r, r, -CH - BL, -CH, 0, 0, M.bit, 16);
      const cone = add(bitG, new THREE.ConeGeometry(r, r * 1.2, 16), M.bit, 0, -CH - BL - r * 0.6, 0); cone.rotation.x = Math.PI;
      for (let k = 0; k < 2; k++) {
        const f = add(bitG, new THREE.BoxGeometry(r * 2.04, BL * 0.85, r * 0.28), M.steel, 0, -CH - BL * 0.55, 0);
        f.rotation.y = k * Math.PI / 2 + 0.4;
      }
    };

    // ---------- stôl s ramenom ----------
    const tbl = grp('stol');
    cylY(tbl, 0.62, 0.62, -1.3, -0.2, 0, -2.4, M.green, 28);
    box(tbl, -0.45, 0.45, -1.0, -0.35, -1.9, SZ - 1.2, M.green);
    box(tbl, SX - 1.65, SX + 1.65, -0.48, -0.3, SZ - 1.35, SZ + 1.35, M.green);
    box(tbl, SX - 1.6, SX + 1.6, -0.3, 0, SZ - 1.3, SZ + 1.3, M.col);
    [SZ - 0.65, SZ, SZ + 0.65].forEach((z) => box(tbl, SX - 1.6, SX + 1.6, -0.03, 0.002, z - 0.07, z + 0.07, M.black));
    box(tbl, 0.55, 0.95, -1.15, -0.45, -2.65, -2.15, M.green);
    const tf = face(tbl, 0.95, -0.8, -2.4, Math.PI / 2);
    cylZ(tf, 0.08, 0.08, 0, 0.12, 0, 0, M.steel, 12);
    const crankT = crank(tf, 0.5, 0, 0, 0.12);
    lever(tbl, -0.62, -0.75, -2.4, 0.45, 0, 1.4);

    // ---------- obrobok na podložkách ----------
    const plateG = grp('obrobok', tbl);
    const plateW = new THREE.Group(); plateG.add(plateW);
    const parG = new THREE.Group(); plateG.add(parG);
    const holeGeo = new THREE.CylinderGeometry(1, 1, 1, 24); holeGeo.translate(0, -0.5, 0);
    let holes = [];
    const showHole = (h) => { h.m.scale.set(h.r, Math.min(h.depth, wk.PT) + 0.004, h.r); };
    const addHole = (x, z, r) => {
      const m = new THREE.Mesh(holeGeo, M.hole); m.position.set(x, PAR + wk.PT + 0.002, z); plateW.add(m);
      const h = { x, z, r, depth: 0, m, through: false }; holes.push(h); return h;
    };
    const makePlate = () => {
      [plateW, parG].forEach((g) => { for (let i = g.children.length - 1; i >= 0; i--) { const o = g.children[i]; if (o.geometry !== holeGeo) o.geometry.dispose(); g.remove(o); } });
      holes = [];
      box(parG, -0.8, -0.6, 0, PAR, -wk.PD / 2, wk.PD / 2, M.steel);
      box(parG, 0.6, 0.8, 0, PAR, -wk.PD / 2, wk.PD / 2, M.steel);
      box(plateW, -wk.PW / 2, wk.PW / 2, PAR, PAR + wk.PT, -wk.PD / 2, wk.PD / 2, M.plate);
    };
    makePlate();
    const findHole = (x, z, r) => holes.find((h) => Math.hypot(h.x - x, h.z - z) < Math.max(0.012, r * 0.35));

    const chipsP = createParticles(scene, new THREE.BoxGeometry(0.05, 0.012, 0.09), M.chip, 120);

    // ---------- stav simulácie ----------
    const st = { q: c.quill / 100, T: T0 + c.table / 100, u: c.u / 100, v: c.v / 100, bit: c.bit, rpm: 0, spin: 0, drillT: -9, msg: null };
    let t = 0, last = performance.now(), teleT = 0, chipAcc = 0;
    const flags = {};
    const say = (text, kind = 'warn') => { st.msg = { text, kind, until: t + 2.6 }; };
    const sayOnce = (key, cond, text, kind) => { if (cond && !flags[key]) say(text, kind); flags[key] = cond; };
    const tipK = (d = st.bit) => NOSE - CH - BL - bitR(d) * 1.2;      // hrot vrtáka pri zasunutej pinole
    buildBit(st.bit);
    // spodné hranice hrotu voči hornej ploche stola pre aktuálnu polohu obrobku
    const floorInfo = (d = st.bit) => {
      const r = bitR(d), px = -st.u, pz = -st.v;
      const onPlate = !c.unclamped && Math.abs(px) < wk.PW / 2 + r * 0.5 && Math.abs(pz) < wk.PD / 2 + r * 0.5;
      let hard = 0, why = 'table';
      if (Math.abs(Math.abs(px) - 0.7) < 0.1 + r && Math.abs(pz) < wk.PD / 2 + r) { hard = PAR; why = 'par'; }
      const h = onPlate ? findHole(px, pz, r) : null;
      const holeD = h && h.r >= r - 1e-6 ? (h.through ? Infinity : h.depth) : 0;
      return { onPlate, hard, why, free: onPlate ? PAR + wk.PT - holeD : -Infinity, px, pz, h, r };
    };
    const limitRel = (rel, old, fi, running, rate) => {
      let r2 = rel, why = null;
      if (fi.onPlate && r2 < fi.free) {
        const lim = running ? Math.min(old, fi.free) - rate : Math.min(old, fi.free);
        if (r2 < lim) { r2 = lim; if (!running) why = 'work'; }
      }
      if (r2 < fi.hard) { r2 = fi.hard; why = fi.why; }
      return [r2, why];
    };

    // ---------- pohľady, popisy a výber dielov ----------
    const anchors = {
      podstavec: () => v3(1.6, 0.6, 2.3),
      stlp: () => v3(0.45, 3.0, -2.2),
      hlava: () => v3(-0.3, 15.75, 0.6),
      motor: () => v3(2.4, 14.3, -0.9),
      vreteno: () => v3(SX + 0.35, NOSE - st.q - 0.5, SZ + 0.3),
      stol: () => v3(SX + 1.6, st.T + 0.05, SZ + 1.3),
      obrobok: () => v3(SX + st.u - 0.6, st.T + PAR + wk.PT + 0.05, SZ + st.v),
    };
    const views = {
      celok: () => [[10.5, 12, 19], [0, 7.8, -0.6]],
      rez: () => [[SX + 2.9, st.T + 3.4, SZ + 4.3], [SX, st.T + 0.6, SZ], true],
      spredu: () => [[0, 8.5, 17], [0, 7.8, -0.5]],
      zhora: () => [[0.3, 22, 6], [0, 6.5, 0]],
      bok: () => [[-11, 12, 5], [-0.6, 12, -0.5], true],
    };
    const insp = createInspector({
      dom, mount, camera, root, G, anchors, views, labelEls: Array.from(layer.querySelectorAll('[data-part]')),
      enabled: () => !c.manual && !c.unclamped, onPick: (k) => apiRef.current.onPick(k), blockPick: () => ctrl.isUsed() || c.unclamped, onHL: () => ctrl.invalidate(),
    });
    const ctrl = createControls({ dom, mount, camera, root, tipEl, c, getT: () => t, getHL: insp.hl });
    const { push, pend } = ctrl;
    apiRef.current.view = (n) => insp.goView(n, false);
    const inPlate = () => tipK() - st.q - st.T < PAR + wk.PT + 0.04 && floorInfo().onPlate;

    // ---------- polotovar ----------
    const wi = createWorkInspect({ scene, camera, dom, insp, c, getObj: () => plateW, getSpot: () => v3(2.6, 9.0, 4.6), onState: (v) => push('unclamped', v) });
    apiRef.current.toggleWork = () => {
      if (wi.phase() === 'in') {
        if (c.running || st.rpm > 1) { say(L('Doska sa berie zo stola len pri stojacom vretene.', 'The plate can only be taken off with the spindle stopped.')); return; }
        if (inPlate() || tipK() - st.q - st.T < PAR + wk.PT + 0.3) { say(L('Najprv vytiahni vrták hore (pinola) alebo spusti stôl.', 'Retract the drill first (quill up) or lower the table.')); return; }
      }
      if (!wi.toggle()) say(L('Počkaj, kým sa dokončí pohyb polotovaru.', 'Wait until the workpiece movement finishes.'), 'info');
    };
    apiRef.current.newBlank = () => {
      if (c.unclamped) { say(L('Najprv polož dosku späť.', 'Put the plate back first.')); return; }
      if (inPlate()) { say(L('Najprv vytiahni vrták z obrobku (pinola hore).', 'Pull the drill out of the workpiece first (quill up).')); return; }
      wk.PW = c.bL / 100; wk.PD = c.bW / 100; wk.PT = c.bT / 100; makePlate();
      say(L('Na podložkách je nová doska bez dier.', 'A new plate without holes is on the parallels.'), 'info');
    };

    // ---------- ručné ovládanie prvkov ----------
    const spdIdx = () => logNear(DRILL_SPEEDS, c.rpm);
    const gearGuard = () => {
      if (!c.running && st.rpm < 1) return true;
      say(L('Otáčky sa preraďujú len pri stojacom vretene – najprv ho zastav.', 'Speeds can only be changed with the spindle stopped – stop it first.'), 'warn'); return false;
    };
    const setSpeed = (a, b) => { push('rpm', DRILL_SPEEDS[a * 4 + b]); say(`${L('Zaradené otáčky', 'Speed selected:')} ${c.rpm} ${RPM()}.`, 'info'); };
    ctrl.reg({ type: 'wheel', minR: 0.9, inc: 1, label: LL('Priečna kľuka posuvu pinoly', 'Capstan quill feed'), hint: LL('Ťahaj za rukoväte k sebe – pinola s vrtákom ide dole. 1 otáčka = 90 mm.', 'Pull the handles towards you – the quill and drill go down. 1 turn = 90 mm.'),
      turn: (d) => { const a = st.q * 100; push('quill', clamp(clamp(c.quill - d * 90 / TAU, a - 6, a + 6), 0, 100)); },
      read: () => `${L('pinola', 'quill')} ${(st.q * 100).toFixed(1)} mm` }, capstan);
    ctrl.reg({ type: 'wheel', minR: 0.35, inc: 1, label: LL('Kľuka zdvihu stola', 'Table elevating crank'), hint: LL('Toč v smere hodinových ručičiek – stôl stúpa. 1 otáčka = 12 mm.', 'Turn clockwise – the table rises. 1 turn = 12 mm.'),
      turn: (d) => { const a = (st.T - T0) * 100; push('table', clamp(clamp(c.table + d * 12 / TAU, a - 10, a + 10), 0, 500)); },
      read: () => `${L('stôl', 'table')} ${((st.T - T0) * 100).toFixed(1)} mm` }, crankT);
    ctrl.reg({ type: 'lever', angles: D2_ANG, minR: 0.22, guard: gearGuard, label: LL('Páka otáčok I (rozsah)', 'Speed lever I (range)'), hint: LL('Pomalý / rýchly rozsah. Len pri stojacom vretene.', 'Slow / fast range. Only with the spindle stopped.'),
      getIdx: () => Math.floor(spdIdx() / 4), onSet: (i) => setSpeed(i, spdIdx() % 4), read: () => `${c.rpm} ${RPM()}` }, levR);
    ctrl.reg({ type: 'lever', angles: D4_ANG, minR: 0.22, guard: gearGuard, label: LL('Páka otáčok II (stupeň)', 'Speed lever II (step)'), hint: LL('4 stupne v každom rozsahu. Len pri stojacom vretene.', '4 steps in each range. Only with the spindle stopped.'),
      getIdx: () => spdIdx() % 4, onSet: (i) => setSpeed(Math.floor(spdIdx() / 4), i), read: () => `${c.rpm} ${RPM()}` }, levS);
    ctrl.reg({ type: 'lever', angles: [0, -Math.PI / 2], minR: 0.2, label: LL('Hlavný vypínač', 'Main switch'), hint: LL('Otoč alebo klikni: 0 = vypnuté, I = zapnuté.', 'Turn or click: 0 = off, I = on.'),
      getIdx: () => (c.power ? 1 : 0),
      onSet: (i) => { push('power', i === 1); if (i === 0) { push('running', false); say(L('Hlavný vypínač vypnutý.', 'Main switch off.'), 'warn'); } else say(L('Hlavný vypínač zapnutý. Vreteno spustíš zeleným tlačidlom.', 'Main switch on. Start the spindle with the green button.'), 'info'); },
      read: () => (c.power ? L('I – zapnuté', 'I – on') : L('0 – vypnuté', '0 – off')) }, mainSwitch);
    ctrl.reg({ type: 'button', label: LL('Tlačidlo ŠTART', 'START button'), hint: LL('Spustí vreteno.', 'Starts the spindle.'),
      action: () => { if (!c.power) say(L('Najprv zapni hlavný vypínač.', 'Switch on the main switch first.'), 'warn'); else push('running', true); } }, btnStart);
    ctrl.reg({ type: 'button', label: LL('Tlačidlo STOP', 'STOP button'), hint: LL('Zastaví vreteno.', 'Stops the spindle.'), action: () => push('running', false) }, btnStop);
    let plate0 = 0;
    ctrl.reg({ type: 'slide', label: LL('Obrobok', 'Workpiece'), hint: LL('Ťahaj dosku po stole doľava alebo doprava (poloha diery v osi X).', 'Drag the plate left or right on the table (hole position in X).'),
      read: () => `X ${(st.u * 100).toFixed(1)} mm`,
      start: () => { plate0 = st.u; },
      slide: (dx) => push('u', clamp((plate0 + dx) * 100, -60, 60)),
      nudge: (dir) => push('u', clamp(st.u * 100 + dir * 5, -60, 60)) }, plateG);

    insp.goView('celok', true);

    // ---------- hlavná slučka ----------
    let raf;
    const loop = (nowMs) => {
      raf = requestAnimationFrame(loop);
      const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs; t += dt;
      st.rpm = approach(st.rpm, c.running && c.power ? c.rpm : 0, 1600 * dt);
      const running = st.rpm > 15;
      const revs = st.rpm > 0 ? 5 * st.rpm / (st.rpm + 400) : 0;
      st.spin += revs * TAU * dt; rot.rotation.y = -st.spin;
      wi.update(dt);

      // výmena vrtáka
      if (c.bit !== st.bit) {
        const tipRel = tipK(c.bit) - st.q - st.T;
        if (c.running || running) { say(L('Vrták sa mení len pri stojacom vretene.', 'The drill can only be changed with the spindle stopped.'), 'warn'); push('bit', st.bit); }
        else if (tipRel < PAR + wk.PT + 0.02 && floorInfo(c.bit).onPlate) { say(L('Najprv vytiahni vrták z obrobku (pinola hore).', 'Pull the drill out of the workpiece first (quill up).'), 'warn'); push('bit', st.bit); }
        else { st.bit = c.bit; buildBit(st.bit); say(`${L('Upnutý vrták', 'Drill clamped:')} Ø${st.bit} mm.`, 'info'); }
      }

      // posun obrobku po stole – nie keď je vrták v diere
      const uT = clamp(c.u, -60, 60) / 100, vT = clamp(c.v, -50, 50) / 100;
      if (uT !== st.u || vT !== st.v) {
        if (tipK() - st.q - st.T < PAR + wk.PT + 0.005 && floorInfo().onPlate) { sayOnce('platemove', true, L('Vrták je v obrobku – najprv vytiahni pinolu hore.', 'The drill is in the workpiece – retract the quill first.'), 'warn'); push('u', st.u * 100); push('v', st.v * 100); }
        else { flags.platemove = false; st.u = approach(st.u, uT, 1.2 * dt); st.v = approach(st.v, vT, 1.2 * dt); }
      }

      const fi = floorInfo();
      const rate = running ? 0.12 * st.rpm / 60 * c.timeScale / 100 * dt : 0;   // posuv 0,12 mm/ot pri vŕtaní
      // stôl
      let nT = approach(st.T, T0 + clamp(c.table, 0, 500) / 100, 0.8 * dt);
      let rel = tipK() - st.q - nT;
      const [r1, why1] = limitRel(rel, tipK() - st.q - st.T, fi, running, rate);
      if (r1 > rel) nT = tipK() - st.q - r1;
      // pinola
      let nq = approach(st.q, clamp(c.quill, 0, 100) / 100, 1.5 * dt);
      rel = tipK() - nq - nT;
      const [r2, why2] = limitRel(rel, tipK() - st.q - nT, fi, running, rate);
      if (r2 > rel) nq = tipK() - r2 - nT;
      const why = why1 || why2;
      sayOnce('work', why === 'work', L('Vrták narazil do obrobku. Pri stojacom vretene nevŕta – spusti vreteno.', 'The drill hit the workpiece. It does not drill with the spindle stopped – start the spindle.'), 'danger');
      sayOnce('par', why === 'par', L('Vrták by navŕtal podložku – posuň obrobok tak, aby bol vrták medzi podložkami.', 'The drill would drill into a parallel – move the workpiece so the drill is between the parallels.'), 'warn');
      sayOnce('table', why === 'table', L('Vrták by navŕtal stôl – zastav posuv pinoly.', 'The drill would drill into the table – stop the quill feed.'), 'warn');
      capstan.rotation.z -= (nq - st.q) / 0.9 * TAU;
      crankT.rotation.z += (nT - st.T) / 0.12 * TAU;
      st.T = nT; st.q = nq;

      // vŕtanie
      const depthNow = PAR + wk.PT - (tipK() - st.q - st.T);
      if (running && fi.onPlate && depthNow > 0.001) {
        let h = fi.h;
        if (!h) h = addHole(fi.px, fi.pz, fi.r);
        else if (h.r < fi.r - 1e-6) { h.r = fi.r; h.depth = 0; h.through = false; }
        if (depthNow > h.depth + 1e-5 && !h.through) {
          h.depth = Math.min(depthNow, wk.PT + 0.01);
          if (h.depth >= wk.PT) { h.through = true; say(`${L('Diera', 'Hole')} Ø${st.bit} mm ${L('je prevŕtaná naskrz.', 'is drilled through.')}`, 'info'); }
          showHole(h); st.drillT = t;
          chipAcc += dt * 40;
          while (chipAcc >= 1) {
            chipAcc -= 1; const a = Math.random() * TAU, s = 1 + Math.random() * 1.5;
            chipsP.spawn(v3(SX + Math.cos(a) * fi.r, st.T + PAR + wk.PT + 0.03, SZ + Math.sin(a) * fi.r), v3(Math.cos(a) * s, 1 + Math.random() * 1.6, Math.sin(a) * s), 3 + Math.random() * 2);
          }
        }
      }
      const drilling = t - st.drillT < 0.25;

      // pohyb skupín
      spG.position.y = NOSE - st.q; tbl.position.y = st.T;
      plateG.position.set(SX + st.u, 0, SZ + st.v);
      M.lamp.emissive.setHex(c.running && c.power ? 0x22dd55 : c.power ? 0x8a5a00 : 0x000000);
      chipsP.update(dt, (p) => (Math.abs(p.x - SX) < 1.6 && Math.abs(p.z - SZ) < 1.3 ? st.T : Math.abs(p.x) < 1.75 && p.z > -1.7 && p.z < 2.0 ? 0.5 : 0.02));

      ctrl.update(dt);
      insp.update(t, c);

      if (t - teleT > 0.1) {
        teleT = t;
        const h = floorInfo().h;
        setTele({
          rpm: st.rpm, quill: st.q * 100, table: (st.T - T0) * 100, depth: h ? Math.min(h.depth, wk.PT) * 100 : 0,
          vc: Math.PI * st.bit * st.rpm / 1000, drilling: drilling && running, holes: holes.length,
          msg: st.msg && st.msg.until > t ? st.msg : null,
        });
        if (Object.keys(pend).length) {
          const p = { ...pend }; Object.keys(pend).forEach((k) => delete pend[k]);
          setUi((u) => ({ ...u, ...p }));
        }
      }
      renderer.render(scene, camera);
    };
    raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); ctrl.dispose(); insp.dispose(); wi.dispose(); holeGeo.dispose(); disposeStage(); };
  }, []);

  const parts = drillParts();
  const statusMsg = tele.msg
    ? tele.msg
    : ui.unclamped ? { kind: 'info', text: L('Doska je zložená zo stola.', 'The plate is taken off the table.') }
    : tele.drilling ? { kind: 'run', text: `${L('Vŕtanie', 'Drilling')} Ø${ui.bit} mm – ${L('hĺbka', 'depth')} ${tele.depth.toFixed(1)} mm, vc ${tele.vc.toFixed(0)} m/min` }
    : tele.rpm > 15 ? { kind: 'run', text: L('Vreteno beží. Spusti vrták kľukou alebo posuvníkom pinoly.', 'The spindle is running. Lower the drill with the capstan or the quill slider.') }
    : !ui.power ? { kind: 'warn', text: L('Hlavný vypínač je vypnutý.', 'The main switch is off.') }
    : { kind: 'idle', text: L('Stroj stojí. Zdvihni stôl k vrtáku a spusti vreteno.', 'The machine is stopped. Raise the table to the drill and start the spindle.') };
  const chips = [{ color: tele.rpm > 15 ? '#3ee06c' : '#8b8f89', text: tele.rpm > 15 ? `${Math.round(tele.rpm)} ${RPM()}` : L('Vreteno stojí', 'Spindle stopped') }];
  if (tele.drilling) chips.push({ color: '#ffb340', text: L('Vŕtanie', 'Drilling') });
  if (tele.holes) chips.push({ color: '#7fb6ff', text: `${L('Diery', 'Holes')}: ${tele.holes}` });
  const rec = Math.round(25000 / (Math.PI * ui.bit));

  return (
    <div className="machine-app w-full flex flex-col md:flex-row">
      <SceneView mountRef={mountRef} layerRef={layerRef} tipRef={tipRef} ui={ui} set={set} parts={parts} selected={selected} selectPart={selectPart} chips={chips} onBack={onBack} apiRef={apiRef} />
      <aside className="panel">
        <PanelHeader ui={ui} set={set} kicker={L('Simulátor · vŕtačka', 'Simulator · drill')} title={L('Stĺpová vŕtačka', 'Pillar drill')}
          sub={L('Predloha: TOS SV16, vŕtanie do Ø16 mm v oceli. Mierka 1 : 100 mm.', 'Modelled after the TOS SV16, drilling up to Ø16 mm in steel. Scale 1 : 100 mm.')}
          rows={[[L('Hĺbka', 'Depth'), tele.depth.toFixed(2)], [L('Pinola', 'Quill'), tele.quill.toFixed(2)], [L('Stôl', 'Table'), tele.table.toFixed(2)]]}
          foot={[`n ${Math.round(tele.rpm)} ${RPM()}`, `vc ${tele.vc.toFixed(0)} m/min`]} status={statusMsg} />

        <div className="sec">
          <h3 className="sec-title mb-2">{L('Hlavný chod', 'Main drive')}</h3>
          <button type="button" className={`btn-run ${ui.running ? 'stop' : 'start'}`}
            onClick={() => { if (!ui.running && !ui.power) set('power', true); set('running', !ui.running); }}>
            {ui.running ? L('■ Stop vretena', '■ Stop spindle') : L('▶ Štart vretena', '▶ Start spindle')}
          </button>
          <div className="mt-2"><Toggle on={ui.power} label={L('Hlavný vypínač', 'Main switch')} onClick={() => { const v = !ui.power; set('power', v); if (!v) set('running', false); }} /></div>
          <div className="mt-3"><Slider id="drpm" label={L('Otáčky vretena', 'Spindle speed')} unit={RPM()} min={125} max={1400} step={5} value={ui.rpm} onChange={(v) => set('rpm', v)} /></div>
        </div>

        <div className="sec">
          <h3 className="sec-title mb-2">{L('Vrták', 'Drill')}</h3>
          <div className="flex flex-wrap gap-1.5 mb-2">
            {DRILL_SIZES.map((d) => <button key={d} type="button" className={`btn ${ui.bit === d ? 'active' : ''}`} aria-pressed={ui.bit === d} onClick={() => set('bit', d)}>Ø{d}</button>)}
          </div>
          <p className="text-xs muted">{L(`Pre oceľ je vhodná rezná rýchlosť 20 – 30 m/min: pre Ø${ui.bit} približne ${rec} ot/min. Vrták sa mení len pri stojacom vretene.`, `For steel use a cutting speed of 20 – 30 m/min: about ${rec} rpm for Ø${ui.bit}. Drills are changed only with the spindle stopped.`)}</p>
        </div>

        <div className="sec">
          <h3 className="sec-title mb-2">{L('Posuvy', 'Feeds')}</h3>
          <Slider id="dq" label={L('Výsuv pinoly', 'Quill extension')} unit="mm" min={0} max={100} step={0.5} value={ui.quill} actual={tele.quill} digits={1} onChange={(v) => set('quill', v)} />
          <Slider id="dt" label={L('Výška stola', 'Table height')} unit="mm" min={0} max={500} step={1} value={ui.table} actual={tele.table} onChange={(v) => set('table', v)} />
          <SegRow label={L('Zrýchlenie vŕtania', 'Drilling acceleration')} value={ui.timeScale} options={[[1, '1×'], [5, '5×'], [20, '20×']]} onChange={(v) => set('timeScale', v)} />
          <p className="text-xs muted">{L('Pri vŕtaní je posuv obmedzený na 0,12 mm/ot – rýchlejšie ako vrták reže, pinola nepôjde.', 'While drilling the feed is limited to 0.12 mm/rev – the quill will not go faster than the drill cuts.')}</p>
        </div>

        <div className="sec">
          <h3 className="sec-title mb-2">{L('Poloha obrobku', 'Workpiece position')}</h3>
          <Slider id="du" label={L('Posun dosky X', 'Plate offset X')} unit="mm" min={-60} max={60} step={1} value={ui.u} onChange={(v) => set('u', v)} />
          <Slider id="dv" label={L('Posun dosky Y', 'Plate offset Y')} unit="mm" min={-50} max={50} step={1} value={ui.v} onChange={(v) => set('v', v)} />
          <p className="text-xs muted">{L('Podložky sú 70 mm vľavo a vpravo od stredu dosky – tam nevŕtaj naskrz.', 'The parallels are 70 mm left and right of the plate centre – do not drill through there.')}</p>
        </div>

        <BlankSection onApply={() => apiRef.current.newBlank && apiRef.current.newBlank()} applyLabel={L('Položiť novú dosku bez dier', 'Put down a new plate without holes')}>
          <Slider id="dbl" label={L('Dĺžka', 'Length')} unit="mm" min={160} max={240} step={10} value={ui.bL} onChange={(v) => set('bL', v)} />
          <Slider id="dbw" label={L('Šírka', 'Width')} unit="mm" min={80} max={150} step={10} value={ui.bW} onChange={(v) => set('bW', v)} />
          <Slider id="dbt" label={L('Hrúbka', 'Thickness')} unit="mm" min={10} max={40} step={5} value={ui.bT} onChange={(v) => set('bT', v)} />
        </BlankSection>

        <ViewSection apiRef={apiRef}
          views={[['celok', L('Celok', 'Overview')], ['rez', L('Detail vŕtania', 'Drilling detail')], ['spredu', L('Spredu', 'Front')], ['zhora', L('Zhora', 'Top')], ['bok', L('Kľuka pinoly', 'Capstan')]]} />
        <PartsSection parts={parts} selected={selected} selectPart={selectPart} />
        <HelpFooter />
      </aside>
    </div>
  );
}

const FOLD = { TT: 8.0, L: 5.2, MAXA: 130 };   // výška stola, polovica dĺžky líšt
const foldParts = () => mkParts([
  ['ramy', 'Bočné stojany', 'Side frames', 'Bočné stojany', 'Side frames', 'Dva liatinové stojany s nohami a priečnymi tyčami nesú celý stroj. Na pravom je ručné koleso upínania so stupnicou.', 'Two cast-iron frames with legs and tie bars carry the whole machine. The right one has the clamping handwheel with a scale.'],
  ['stol', 'Stôl', 'Bed', 'Stôl (spodná lišta)', 'Bed (lower beam)', 'Pevná spodná lišta s kalenou hranou – os ohybu leží presne na jej prednej hrane.', 'Fixed lower beam with a hardened edge – the bending axis lies exactly on its front edge.'],
  ['upinacia', 'Upínacia lišta', 'Clamping beam', 'Upínacia lišta', 'Clamping beam', 'Horná lišta so skoseným nosom pritlačí plech k stolu. Spúšťa sa kolesom cez dve zdvíhacie skrutky; nos je skosený, aby ohyb mohol ísť až do 130°.', 'The upper beam with a bevelled nose presses the sheet onto the bed. It is lowered by the handwheel through two lifting screws; the nose is bevelled so the bend can reach 130°.'],
  ['ohybacia', 'Ohýbacia lišta', 'Folding beam', 'Ohýbacia (výkyvná) lišta', 'Folding (swing) beam', 'Otáča sa okolo osi na prednej hrane stola. Za rukoväť pod lištou ju obsluha vykýva nahor a ohne vyčnievajúci okraj plechu.', 'Pivots about the axis on the front edge of the bed. The operator swings it up by the handle and folds the protruding edge of the sheet.'],
  ['skrutky', 'Skrutky upínania', 'Lifting screws', 'Zdvíhacie skrutky', 'Lifting screws', 'Dve závitové skrutky na koncoch upínacej lišty, spojené cez koleso a ozubené prevody – lišta klesá rovnobežne. 1 otáčka kolesa = 5 mm.', 'Two threaded screws at the ends of the clamping beam, linked through the handwheel and gears – the beam descends parallel. 1 turn = 5 mm.'],
  ['plech', 'Plech', 'Sheet', 'Plech', 'Sheet', 'Oceľový plech zvoleného rozmeru hrúbky 0,5 – 2 mm (predloha FASTI 204-10-2: dĺžka ohybu 1 040 mm, max. 2 mm). Po ohnutí sa časť ohybu vráti – odpruží.', 'Steel sheet of the selected size, 0.5 – 2 mm thick (model FASTI 204-10-2: 1,040 mm bending length, max. 2 mm). After bending part of the bend springs back.'],
]);

function FolderSimulator({ onBack }) {
  const mountRef = useRef(null), layerRef = useRef(null), tipRef = useRef(null);
  const init = { manual: false, gap: 30, beam: 0, flange: 50, thick: 1, bLen: 800, bDep: 300 };
  const { ctl, ui, setUi, set, selected, selectPart, apiRef } = useMachine(init);
  const [tele, setTele] = useState({ beam: 0, sheet: 0, perm: 0, gap: 30, clamped: false, msg: null, bending: false });

  useEffect(() => {
    const mount = mountRef.current, layer = layerRef.current, tipEl = tipRef.current;
    const c = ctl.current;
    const { TT, L: BL, MAXA } = FOLD;
    const wk = { SW: 4.0, SD: 3.0 };                                         // polovica šírky plechu, hĺbka plechu
    const { renderer, scene, camera, dispose: disposeStage } = createStage(mount);
    const dom = renderer.domElement;
    const M = { ...baseMats(0x9dc58b, 0x82ab70, 0x5f8253), sheet: std(0xb4bcc4, 0.35, 0.75, { side: THREE.DoubleSide }), screw: std(0x3b3d40, 0.45, 0.7) };
    const { add, box, cylX, cylY, cylZ, ball, handwheel, face, rod } = makeKit(M);
    const root = new THREE.Group(); scene.add(root);
    const G = {};
    const grp = (k, parent = root) => { const g = new THREE.Group(); g.userData.part = k; parent.add(g); G[k] = g; return g; };
    const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
    const D2R = Math.PI / 180;
    // profil v rovine (z, y) vytiahnutý pozdĺž osi X na dĺžku 2·len
    const prism = (p, pts, len, m, x = 0, y = 0, z = 0) => {
      const s = new THREE.Shape(); pts.forEach(([a, b], i) => (i ? s.lineTo(a, b) : s.moveTo(a, b)));
      const g = new THREE.ExtrudeGeometry(s, { depth: 2 * len, bevelEnabled: false }); g.rotateY(-Math.PI / 2); g.translate(len, 0, 0);
      return add(p, g, m, x, y, z);
    };

    // ---------- bočné stojany ----------
    const fr = grp('ramy');
    [-1, 1].forEach((sx) => {
      const x0 = sx * 5.7;
      box(fr, x0 - 0.3, x0 + 0.3, 0, 10.6, -1.7, -1.0, M.green);                // stĺpik
      box(fr, x0 - 0.35, x0 + 0.35, 10.4, 10.7, -1.8, -0.9, M.green);
      const leg = box(fr, x0 - 0.22, x0 + 0.22, 0, 7.4, -0.25, 0.25, M.green);  // šikmá predná noha
      leg.position.set(x0, 3.4, 0.9); leg.rotation.x = -0.32;
      box(fr, x0 - 0.35, x0 + 0.35, 0, 0.12, -2.0, -0.7, M.greenDark);
      box(fr, x0 - 0.3, x0 + 0.3, 0, 0.12, 1.8, 2.4, M.greenDark);
    });
    cylX(fr, 0.07, 0.07, -5.5, 5.5, 1.0, 1.3, M.green, 12);                     // priečne tyče
    cylX(fr, 0.07, 0.07, -5.5, 5.5, 2.4, -1.35, M.green, 12);
    box(fr, 6.0, 6.5, TT - 1.2, TT + 0.2, -1.0, -0.2, M.green);                  // ložisko kolesa
    cylX(fr, 0.36, 0.36, 6.35, 6.5, TT - 0.6, -0.6, M.black, 40);                // stupnica
    cylX(fr, 0.06, 0.06, 6.5, 6.75, TT - 0.6, -0.6, M.steel, 12);
    const wheelC = handwheel(fr, 0.65, 6.8, TT - 0.6, -0.6, 'x', 0.45);

    // ---------- stôl (spodná lišta) ----------
    const tbl = grp('stol');
    prism(tbl, [[0, 0], [-1.3, 0], [-1.3, -1.2], [-0.4, -1.6], [0, -1.6]], BL + 0.2, M.green, 0, TT, 0);
    box(tbl, -BL, BL, TT - 0.35, TT, -0.18, 0, M.steel);                           // kalená hrana
    box(tbl, -BL - 0.2, BL + 0.2, TT - 0.02, TT, -1.3, -0.18, M.greenDark);
    [-2.6, 0, 2.6].forEach((x) => cylZ(tbl, 0.32, 0.32, -0.01, 0.002, x, TT - 0.9, M.greenDark, 24));

    // ---------- upínacia lišta ----------
    const clampG = grp('upinacia');
    prism(clampG, [[-0.03, 0], [-1.05, 0], [-1.05, 1.5], [-0.62, 1.5], [-0.62, 0.55]], BL, M.green);
    box(clampG, -BL, BL, 0, 0.12, -0.62, -0.03, M.steel);
    const arch = new THREE.Shape(); arch.moveTo(-BL, 1.45); arch.lineTo(BL, 1.45); arch.lineTo(BL, 2.1); arch.quadraticCurveTo(0, 3.2, -BL, 2.1); arch.lineTo(-BL, 1.45);
    const archG = new THREE.ExtrudeGeometry(arch, { depth: 0.45, bevelEnabled: false });
    add(clampG, archG, M.green, 0, 0, -1.0);
    [-1, 1].forEach((sx) => { box(clampG, sx * BL - 0.25, sx * BL + 0.25, 0.4, 1.9, -1.15, -0.35, M.green); cylY(clampG, 0.26, 0.26, 1.9, 2.15, sx * 5.45, -0.75, M.insert, 6); });

    // ---------- zdvíhacie skrutky ----------
    const scr = grp('skrutky');
    const screws = [-1, 1].map((sx) => cylY(scr, 0.13, 0.13, TT - 0.5, TT + 4.2, sx * 5.45, -0.75, M.screw, 16));

    // ---------- ohýbacia lišta (os = predná hrana stola) ----------
    const swAxis = grp('ohybacia'); swAxis.position.set(0, TT, 0); swAxis.rotation.y = -Math.PI / 2;   // lokálna x = dopredu, z = -X
    const swing = new THREE.Group(); swAxis.add(swing);
    box(swing, 0, 0.42, -0.3, 0, -BL, BL, M.steel);
    const swProf = new THREE.Shape(); [[0, -0.3], [0.62, -0.3], [0.62, -0.95], [0.1, -1.25], [0, -1.25]].forEach(([a, b], i) => (i ? swProf.lineTo(a, b) : swProf.moveTo(a, b)));
    const swGeo = new THREE.ExtrudeGeometry(swProf, { depth: 2 * BL, bevelEnabled: false }); swGeo.translate(0, 0, -BL);
    add(swing, swGeo, M.green);
    [-1, 1].forEach((sz) => {
      cylZ(swing, 0.32, 0.32, sz > 0 ? BL : -BL - 0.38, sz > 0 ? BL + 0.38 : -BL, 0, 0, M.green, 24);
      rod(swing, v3(0.35, -1.1, sz * 2.4), v3(1.25, -3.1, sz * 2.4), 0.06, M.steel);
    });
    cylZ(swing, 0.065, 0.065, -2.5, 2.5, 1.25, -3.1, M.steel, 14);                // rukoväť

    // ---------- plech ----------
    const sheetG = grp('plech'); sheetG.position.set(0, TT, 0);
    const flat = add(sheetG, new THREE.BoxGeometry(1, 1, 1), M.sheet);
    const fAxis = new THREE.Group(); fAxis.rotation.y = -Math.PI / 2; sheetG.add(fAxis);
    const fRot = new THREE.Group(); fAxis.add(fRot);
    const flange = add(fRot, new THREE.BoxGeometry(1, 1, 1), M.sheet);
    const shapeSheet = (Lmm, tmm) => {
      const fl = Lmm / 100, th = tmm / 100;
      flat.scale.set(2 * wk.SW, th, wk.SD - fl); flat.position.set(0, th / 2, -(wk.SD - fl) / 2);
      flange.scale.set(fl, th, 2 * wk.SW); flange.position.set(fl / 2, th / 2, 0);
    };

    // ---------- stav simulácie ----------
    const st = { gap: c.gap, B: 0, P: 0, L: c.flange, th: c.thick, msg: null, bendT: -9 };
    let t = 0, last = performance.now(), teleT = 0;
    const flags = {};
    const say = (text, kind = 'warn') => { st.msg = { text, kind, until: t + 2.6 }; };
    const sayOnce = (key, cond, text, kind) => { if (cond && !flags[key]) say(text, kind); flags[key] = cond; };
    const spring = () => 1.5 + 1.2 * st.th;                                   // odpruženie v stupňoch
    const clamped = () => !c.unclamped && st.gap <= st.th + 0.05;
    shapeSheet(st.L, st.th);

    // ---------- pohľady, popisy a výber dielov ----------
    const anchors = {
      ramy: () => v3(-5.7, 10.85, -1.35),
      stol: () => v3(-4.6, TT - 1.0, 0.1),
      upinacia: () => v3(0, TT + st.gap / 100 + 2.95, -0.8),
      ohybacia: () => v3(3.6, TT - 1.0 + Math.sin(st.B * D2R) * 0.8, 0.7),
      skrutky: () => v3(5.45, TT + 4.35, -0.75),
      plech: () => v3(-Math.min(3.0, wk.SW - 0.6), TT + 0.1, -0.9),
    };
    const views = {
      celok: () => [[8, 13, 17], [0, 6.5, 0]],
      rez: () => [[-1.6, TT + 4.6, 6.4], [-3.4, TT + 0.4, -0.2], true],
      spredu: () => [[0, 8.5, 19], [0, 6.5, 0]],
      bok: () => [[17, TT + 2.0, 0.5], [0, TT, -0.3], true],
      zadu: () => [[-6, 12, -15], [0, 7, -0.5]],
    };
    const insp = createInspector({
      dom, mount, camera, root, G, anchors, views, labelEls: Array.from(layer.querySelectorAll('[data-part]')),
      enabled: () => !c.manual && !c.unclamped, onPick: (k) => apiRef.current.onPick(k), blockPick: () => ctrl.isUsed() || c.unclamped, onHL: () => ctrl.invalidate(),
    });
    const ctrl = createControls({ dom, mount, camera, root, tipEl, c, getT: () => t, getHL: insp.hl });
    const { push, pend } = ctrl;
    apiRef.current.view = (n) => insp.goView(n, false);

    // ---------- polotovar ----------
    const wi = createWorkInspect({ scene, camera, dom, insp, c, getObj: () => sheetG, getSpot: () => v3(0, TT + 2.5, 6.0), onState: (v) => push('unclamped', v) });
    apiRef.current.toggleWork = () => {
      if (wi.phase() === 'in') {
        if (st.B > 0.5) { say(L('Najprv sklop ohýbaciu lištu dole.', 'Lower the folding beam first.')); return; }
        if (st.gap < st.th + 1) { say(L('Najprv uvoľni upínaciu lištu – plech je upnutý.', 'Release the clamping beam first – the sheet is clamped.')); return; }
      }
      if (!wi.toggle()) say(L('Počkaj, kým sa dokončí pohyb plechu.', 'Wait until the sheet movement finishes.'), 'info');
    };
    apiRef.current.newBlank = () => {
      if (c.unclamped) { say(L('Najprv vlož plech späť.', 'Put the sheet back first.')); return; }
      if (st.B > 0.5) { say(L('Najprv sklop ohýbaciu lištu dole.', 'Lower the folding beam first.'), 'warn'); return; }
      if (clamped()) { say(L('Najprv uvoľni upínaciu lištu.', 'Release the clamping beam first.'), 'warn'); return; }
      wk.SW = c.bLen / 200; wk.SD = c.bDep / 100; st.P = 0; st.th = c.thick; st.L = clamp(c.flange, 10, Math.min(150, c.bDep - 50));
      shapeSheet(st.L, st.th); say(L('Vložený nový rovný plech.', 'A new flat sheet is inserted.'), 'info');
    };

    ctrl.reg({ type: 'wheel', minR: 0.5, inc: -1, label: LL('Koleso upínania', 'Clamping handwheel'), hint: LL('V smere hodinových ručičiek lišta klesá a upne plech. 1 otáčka = 5 mm.', 'Clockwise lowers the beam and clamps the sheet. 1 turn = 5 mm.'),
      turn: (d) => push('gap', clamp(clamp(c.gap + d * 5 / TAU, st.gap - 4, st.gap + 4), 0, 40)),
      read: () => `${L('medzera', 'gap')} ${st.gap.toFixed(2)} mm` }, wheelC);
    ctrl.reg({ type: 'wheel', minR: 1.2, inc: 1, label: LL('Ohýbacia lišta', 'Folding beam'), hint: LL('Ťahaj za rukoväť alebo lištu nahor – ohne vyčnievajúci okraj plechu.', 'Drag the handle or the beam upwards – it folds the protruding edge of the sheet.'),
      turn: (d) => push('beam', clamp(clamp(c.beam + d / D2R, st.B - 12, st.B + 12), 0, MAXA)),
      read: () => `${st.B.toFixed(1)}°` }, swing);

    insp.goView('celok', true);

    // ---------- hlavná slučka ----------
    let raf;
    const loop = (nowMs) => {
      raf = requestAnimationFrame(loop);
      const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs; t += dt;
      wi.update(dt);

      // plech: hrúbka a vyloženie sa dajú meniť len pri voľnom rovnom plechu
      if (c.thick !== st.th || c.flange !== st.L) {
        if (clamped() || st.B > 0.5 || st.P > 0.01) {
          say(st.P > 0.01 ? L('Ohnutý plech sa už nedá posúvať – vlož nový plech.', 'A bent sheet can no longer be moved – insert a new sheet.') : L('Najprv uvoľni upínaciu lištu a sklop ohýbaciu lištu.', 'Release the clamping beam and lower the folding beam first.'), 'warn');
          push('thick', st.th); push('flange', st.L);
        } else { st.th = c.thick; st.L = clamp(c.flange, 10, Math.min(150, wk.SD * 100 - 50)); shapeSheet(st.L, st.th); }
      }

      // upínacia lišta – dosadne na plech (bez plechu až na stôl)
      const gT = clamp(c.gap, 0, 40);
      let ng = approach(st.gap, gT, 18 * dt);
      const floorG = c.unclamped ? 0 : st.th;
      if (ng < floorG) ng = floorG;
      sayOnce('clamp', !c.unclamped && gT < st.th + 0.05 && ng <= st.th + 0.05, L('Upínacia lišta dosadla – plech je upnutý.', 'The clamping beam has seated – the sheet is clamped.'), 'info');
      wheelC.rotation.z += (ng - st.gap) / 5 * TAU;
      screws.forEach((s) => { s.rotation.y -= (ng - st.gap) / 5 * TAU; });
      st.gap = ng;

      // ohýbacia lišta
      const bT = clamp(c.beam, 0, MAXA);
      let nb = approach(st.B, bT, 75 * dt);
      if (nb > st.B && !clamped() && nb > 2 && !c.unclamped) { nb = Math.max(st.B, 2); push('beam', nb); }
      sayOnce('loose', bT > 2 && !clamped() && !c.unclamped, L('Plech nie je upnutý – pri ohybe by vyskočil. Najprv dotiahni upínaciu lištu kolesom vpravo.', 'The sheet is not clamped – it would jump out when bending. Tighten the clamping beam with the handwheel on the right first.'), 'danger');
      sayOnce('maxa', bT >= MAXA && nb >= MAXA - 0.1, `${L('Ohýbacia lišta je na doraze', 'The folding beam is at its stop of')} ${MAXA}° – ${L('ďalej by narazila do nosa upínacej lišty.', 'further it would hit the clamping beam nose.')}`, 'warn');
      if (nb > st.B + 1e-6 && clamped() && nb > st.P) st.bendT = t;
      st.B = nb;
      // trvalý ohyb a odpruženie
      if (clamped() && st.B - spring() > st.P) st.P = st.B - spring();
      const shown = clamped() ? Math.max(st.P, st.B) : st.P;
      swing.rotation.z = st.B * D2R;
      fRot.rotation.z = shown * D2R;
      clampG.position.y = TT + st.gap / 100;

      ctrl.update(dt);
      insp.update(t, c);

      if (t - teleT > 0.1) {
        teleT = t;
        setTele({ beam: st.B, sheet: shown, perm: st.P, gap: st.gap, clamped: clamped(), bending: t - st.bendT < 0.2, msg: st.msg && st.msg.until > t ? st.msg : null });
        if (Object.keys(pend).length) {
          const p = { ...pend }; Object.keys(pend).forEach((k) => delete pend[k]);
          setUi((u) => ({ ...u, ...p }));
        }
      }
      renderer.render(scene, camera);
    };
    raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); ctrl.dispose(); insp.dispose(); wi.dispose(); disposeStage(); };
  }, []);

  const parts = foldParts();
  const sb = 1.5 + 1.2 * ui.thick;
  const fmt = (v) => L(v.toFixed(1).replace('.', ','), v.toFixed(1));
  const statusMsg = tele.msg
    ? tele.msg
    : ui.unclamped ? { kind: 'info', text: L('Plech je vybratý zo stroja.', 'The sheet is out of the machine.') }
    : tele.bending ? { kind: 'run', text: `${L('Ohýbanie – plech', 'Bending – sheet')} ${tele.sheet.toFixed(1)}°, ${L('po uvoľnení odpruží na', 'springs back to')} ${tele.perm.toFixed(1)}°` }
    : !tele.clamped ? { kind: 'idle', text: L('Plech je voľný. Nastav vyloženie a dotiahni upínaciu lištu kolesom.', 'The sheet is free. Set the flange length and tighten the clamping beam with the handwheel.') }
    : tele.perm > 0.05 ? { kind: 'info', text: `${L('Plech je ohnutý na', 'The sheet is bent to')} ${tele.perm.toFixed(1)}° (${L('odpruženie', 'springback')} ${fmt(sb)}°).` }
    : { kind: 'run', text: L('Plech je upnutý. Vykývni ohýbaciu lištu nahor.', 'The sheet is clamped. Swing the folding beam up.') };
  const chips = [{ color: tele.clamped ? '#3ee06c' : '#8b8f89', text: tele.clamped ? L('Plech upnutý', 'Sheet clamped') : L('Plech voľný', 'Sheet free') }];
  if (tele.perm > 0.05) chips.push({ color: '#7fb6ff', text: `${L('Ohyb', 'Bend')} ${tele.perm.toFixed(1)}°` });

  return (
    <div className="machine-app w-full flex flex-col md:flex-row">
      <SceneView mountRef={mountRef} layerRef={layerRef} tipRef={tipRef} ui={ui} set={set} parts={parts} selected={selected} selectPart={selectPart} chips={chips} onBack={onBack} apiRef={apiRef} />
      <aside className="panel">
        <PanelHeader ui={ui} set={set} kicker={L('Simulátor · ohýbačka', 'Simulator · folder')} title={L('Výkyvná ohýbačka plechu', 'Manual swing-beam folder')}
          sub={L('Predloha: FASTI 204-10-2, dĺžka ohybu 1 040 mm, plech do 2 mm. Mierka 1 : 100 mm.', 'Modelled after the FASTI 204-10-2, 1,040 mm bending length, sheet up to 2 mm. Scale 1 : 100 mm.')}
          rows={[[L('Lišta', 'Beam'), `${tele.beam.toFixed(1)}°`], [L('Plech', 'Sheet'), `${tele.sheet.toFixed(1)}°`], [L('Medzera', 'Gap'), tele.gap.toFixed(2)]]}
          foot={[`${L('plech', 'sheet')} ${ui.thick} mm`, `${L('odpruženie', 'springback')} ${fmt(sb)}°`]} status={statusMsg} />

        <div className="sec">
          <h3 className="sec-title mb-2">{L('Plech a upínanie', 'Sheet and clamping')}</h3>
          <SegRow label={L('Hrúbka plechu', 'Sheet thickness')} value={ui.thick} options={[[0.5, L('0,5 mm', '0.5 mm')], [1, '1 mm'], [2, '2 mm']]} onChange={(v) => set('thick', v)} />
          <Slider id="ffl" label={L('Vyloženie (dĺžka ohnutého okraja)', 'Flange length (bent edge)')} unit="mm" min={10} max={150} step={1} value={ui.flange} onChange={(v) => set('flange', v)} />
          <Slider id="fgap" label={L('Upínacia lišta – medzera nad stolom', 'Clamping beam – gap above the bed')} unit="mm" min={0} max={40} step={0.1} value={ui.gap} actual={tele.gap} digits={1} onChange={(v) => set('gap', v)} />
          <div className="flex gap-2">
            <button type="button" className="btn flex-1" onClick={() => set('gap', 0)}>{L('Upnúť', 'Clamp')}</button>
            <button type="button" className="btn flex-1" onClick={() => set('gap', 30)}>{L('Uvoľniť', 'Release')}</button>
          </div>
        </div>

        <div className="sec">
          <h3 className="sec-title mb-2">{L('Ohýbanie', 'Bending')}</h3>
          <Slider id="fbeam" label={L('Uhol ohýbacej lišty', 'Folding beam angle')} unit="°" min={0} max={130} step={0.5} value={ui.beam} actual={tele.beam} digits={1} onChange={(v) => set('beam', v)} />
          <div className="flex flex-wrap gap-2">
            {[45, 90, 120].map((a) => <button key={a} type="button" className="btn" onClick={() => set('beam', a + sb)}>{a}° (+{fmt(sb)}°)</button>)}
            <button type="button" className="btn" onClick={() => set('beam', 0)}>{L('Sklopiť', 'Lower')}</button>
          </div>
          <p className="text-xs muted mt-2">{L(`Plech po uvoľnení odpruží o ${fmt(sb)}°, preto treba lištu vykývnuť o kúsok ďalej, ako je cieľový uhol.`, `After release the sheet springs back by ${fmt(sb)}°, so swing the beam slightly past the target angle.`)}</p>
        </div>

        <BlankSection onApply={() => apiRef.current.newBlank && apiRef.current.newBlank()} applyLabel={L('Vložiť nový rovný plech', 'Insert a new flat sheet')}>
          <Slider id="fbl" label={L('Dĺžka plechu (pozdĺž ohybu)', 'Sheet length (along the bend)')} unit="mm" min={300} max={1000} step={50} value={ui.bLen} onChange={(v) => set('bLen', v)} />
          <Slider id="fbd" label={L('Hĺbka plechu', 'Sheet depth')} unit="mm" min={200} max={400} step={10} value={ui.bDep} onChange={(v) => set('bDep', v)} />
        </BlankSection>

        <ViewSection apiRef={apiRef}
          views={[['celok', L('Celok', 'Overview')], ['rez', L('Detail ohybu', 'Bend detail')], ['bok', L('Z boku', 'Side')], ['spredu', L('Spredu', 'Front')], ['zadu', L('Zozadu', 'Rear')]]} />
        <PartsSection parts={parts} selected={selected} selectPart={selectPart} />
        <HelpFooter />
      </aside>
    </div>
  );
}

const grindParts = () => mkParts([
  ['lozko', 'Lôžko', 'Bed', 'Lôžko', 'Bed', 'Skriňové lôžko s hydraulickým agregátom a nádržou chladiva. Vpredu sú ručné kolesá stola a priečneho posuvu a elektrický panel.', 'Box bed with the hydraulic unit and the coolant tank. At the front are the table and cross-feed handwheels and the electrical panel.'],

  ['sane', 'Sane', 'Saddle', 'Priečne sane', 'Cross saddle', 'Nesú stôl a posúvajú ho k stojanu a od neho (os Y) – ručne kolesom alebo automaticky o krok na konci každého zdvihu stola.', 'Carries the table and moves it towards and away from the column (Y axis) – by handwheel or automatically by one step at the end of each table stroke.'],

  ['panel', 'Elektrický panel', 'Control panel', 'Elektrický panel', 'Electrical panel', 'Hlavný vypínač, hydraulika, kotúč, magnet a chladenie (štart / stop) a núdzový STOP.', 'Main switch, hydraulics, wheel, magnet and coolant (start / stop) and the emergency stop.'],

function GrinderSimulator({ onBack }) {
  const mountRef = useRef(null), layerRef = useRef(null), tipRef = useRef(null);
  const init = { power: true, hydro: false, wheel: false, magnet: true, coolant: false, light: true, manual: false, x: 300, y: 105, z: 60, autoX: false, autoY: false, speed: 8, xL: 150, xR: 450, step: 2, yA: 75, yB: 135,

      work: new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.25, metalness: 0.8, flatShading: true, side: THREE.DoubleSide }),
      spark: new THREE.MeshBasicMaterial({ color: 0xffb347, toneMapped: false }),

      mist: new THREE.MeshBasicMaterial({ color: 0xd8f0ff, transparent: true, opacity: 0.55, depthWrite: false }),

    const kit = makeKit(M);

    const root = new THREE.Group(); scene.add(root);

    const grp = (k, parent = root) => { const g = new THREE.Group(); g.userData.part = k; parent.add(g); G[k] = g; return g; };
    const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

    // ---------- lôžko s ručnými kolesami ----------
    const bed = grp('lozko');
    box(bed, -3.3, 3.3, 0, 0.12, -1.9, 2.0, M.greenDark);
    box(bed, -3.2, 3.2, 0.12, 6.2, -1.8, 1.9, M.green);
    box(bed, -2.7, -0.6, 0.7, 4.2, 1.9, 1.94, M.greenDark);
    box(bed, -2.6, -2.2, 6.2, 6.25, -1.6, 1.6, M.ways); box(bed, 2.2, 2.6, 6.2, 6.25, -1.6, 1.6, M.ways);
    box(bed, -3.0, -0.1, 4.7, 6.1, 1.9, 2.55, M.green);                        // konzola kolies

          if (p > 0.0012) { why = 'deep'; return false; }
          return true;
        };
        if (!ok(nx, ny, nz)) {
          blocked = why;
          let ax = st.tx, ay = st.sz, az = st.zb;
          if (ok(nx, ay, az)) ax = nx;
          if (ok(ax, ny, az)) ay = ny;
          if (ok(ax, ay, nz)) az = nz;
          nx = ax; ny = ay; nz = az;
        }
      }
      sayOnce('stopped', blocked === 'stopped', L('Kotúč stojí – pri dotyku by poškodil obrobok. Spusti brúsny kotúč.', 'The wheel is stopped – touching would damage the workpiece. Start the grinding wheel.'), 'danger');
      sayOnce('magnet', blocked === 'magnet', L('Magnetická doska je vypnutá – obrobok nie je upnutý a kotúč by ho vymrštil!', 'The magnetic chuck is off – the workpiece is not held and the wheel would throw it!'), 'danger');
      sayOnce('deep', blocked === 'deep', L('Príliš veľký prísuv – brúsi sa po 0,01 – 0,05 mm, najviac 0,1 mm na prechod.', 'Infeed too large – grind 0.01 – 0.05 mm at a time, at most 0.1 mm per pass.'), 'warn');
      sayOnce('chuck', blocked === 'chuck', L('Kotúč by zabrúsil do magnetickej dosky.', 'The wheel would grind into the magnetic chuck.'), 'warn');
      wX.rotation.z += (nx - st.tx) / 0.1 * TAU; wY.rotation.z += (ny - st.sz) / 0.05 * TAU; wZ.rotation.z += (nz - st.zb) / 0.01 * TAU;
      st.tx = nx; st.sz = ny; st.zb = nz;

      // brúsenie po dráhe od minulej snímky
      const cur = rel(st.tx, st.sz, st.zb), prev = st.last || cur; st.last = cur;
      if (wheelOn() && c.magnet && !c.unclamped) {
        const n = Math.min(80, Math.max(1, Math.ceil(Math.hypot(cur[0] - prev[0], cur[1] - prev[1]) / 0.03)));
        let rem = 0;
        for (let s = 1; s <= n; s++) { const f = s / n; rem += grind(prev[0] + (cur[0] - prev[0]) * f, prev[1] + (cur[1] - prev[1]) * f, prev[2] + (cur[2] - prev[2]) * f); }
        if (rem > 0) {
          st.grindT = t; dirty = true;
          sparkAcc += dt * (c.coolant ? 70 : 160);
          while (sparkAcc >= 1) {
            sparkAcc -= 1;
            sparks.spawn(v3(0.05, CT + st.zb + 0.01, WZc + (Math.random() - 0.5) * 0.4), v3(-(3 + Math.random() * 4) * (st.xdir > 0 || !c.autoX ? 1 : 0.8), 0.4 + Math.random() * 2, (Math.random() - 0.5) * 1.2), 0.3 + Math.random() * 0.35, 6, 0);
          }
        }
      }
      const grinding = t - st.grindT < 0.25;
      if (dirty && t - lastBuild > 0.08) { hf.rebuild(); dirty = false; lastBuild = t; }

      // pohyb skupín
      head.position.y = CT + st.zb + R; sad.position.z = st.sz; tbl.position.x = st.tx;
      dogL.position.x = -(xl - 300) / 100; dogR.position.x = -(xr - 300) / 100;

      // emulzia: prúd z dýzy, kvapky a jemná hmla strhávaná kotúčom
      stream.visible = c.coolant && c.power;
      if (stream.visible) {
        M.coolant.opacity = 0.45 + 0.12 * Math.sin(t * 40);
        head.updateMatrixWorld();
        const a = nozzleA.clone().applyMatrix4(head.matrixWorld), b = nozzleB.clone().applyMatrix4(head.matrixWorld), dir = b.clone().sub(a).normalize();
        dropAcc += dt * 80;
        while (dropAcc >= 1) { dropAcc -= 1; drops.spawn(a.clone().lerp(b, Math.random()), dir.clone().multiplyScalar(2.4).add(v3((Math.random() - 0.5) * 0.5, 0, (Math.random() - 0.5) * 0.5)), 1.4); }
        if (wheelOn()) {
          mistAcc += dt * (grinding ? 150 : 60);
          while (mistAcc >= 1) {
            mistAcc -= 1; const sp = 2 + Math.random() * 3.5;
            mist.spawn(v3(-0.1 + Math.random() * 0.3, CT + st.zb + 0.02 + Math.random() * 0.05, WZc + (Math.random() - 0.5) * 0.4), v3(-sp, 0.3 + Math.random() * 1.6, (Math.random() - 0.5) * 1.4), 0.4 + Math.random() * 0.5, 5, 0);
          }
        }
      }
      const floorAt = (p) => {
        const lx = p.x - st.tx, lz = p.z - st.sz;
        if (Math.abs(lx) < wk.WX / 2 && Math.abs(lz) < wk.WZ / 2 && !c.unclamped) return CT + wk.H;
        if (Math.abs(lx) < 2.5 && Math.abs(lz) < 0.75) return CT;
        if (Math.abs(lx) < 4.6 && Math.abs(lz) < 1.05) return 7.6;
        return 0.02;
      };
      drops.update(dt, floorAt); mist.update(dt, floorAt);
      lampW.emissive.setHex(st.wr > 15 ? 0x22dd55 : 0); lampM.emissive.setHex(c.magnet ? 0xffb020 : 0);
      sparks.update(dt, () => -1);
      lamp.update(c.light);

      ctrl.update(dt);
      insp.update(t, c);

      if (t - teleT > 0.1) {
        teleT = t;
        let mn = wk.H; for (let k = 0; k < hf.hgt.length; k++) if (hf.hgt[k] < mn) mn = hf.hgt[k];
        setTele({ x: xAct(), y: yAct(), z: zAct(), wrpm: st.wr, removed: (wk.H - mn) * 100, grinding: grinding && wheelOn(), msg: st.msg && st.msg.until > t ? st.msg : null });
        if (c.autoX && c.hydro) pend.x = Math.round(c.x * 10) / 10;
        if (Object.keys(pend).length) {
          const p = { ...pend }; Object.keys(pend).forEach((k) => delete pend[k]);
          setUi((u) => ({ ...u, ...p }));
        }
      }
      renderer.render(scene, camera);
    };
    raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); ctrl.dispose(); insp.dispose(); wi.dispose(); disposeStage(); };
  }, []);

  const parts = grindParts();

    : !ui.manual ? { kind: 'idle', text: L('Prepni na režim Zváranie (M) – potom drž pravé tlačidlo a veď elektródu, ľavým zapáliš oblúk. Kukla: H.', 'Switch to welding mode (M) – then hold the right button to guide the electrode, press the left one to strike the arc. Helmet: H.') }
    : { kind: 'idle', text: L('Drž pravé tlačidlo a veď elektródu k spoju, ľavým tlačidlom zapáliš oblúk. Kukla: H.', 'Hold the right button to guide the electrode to the joint, press the left button to strike the arc. Helmet: H.') };
  const chips = [{ color: tele.arc ? '#ffffff' : '#8b8f89', text: tele.arc ? L('Oblúk', 'Arc') : L('Oblúk zhasnutý', 'No arc') }];
  if (ui.helmet) chips.push({ color: '#3ee06c', text: L('Kukla dole', 'Helmet down') });
  if (tele.hot > 0.15) chips.push({ color: '#ff7a2a', text: L('Horúci zvar', 'Hot weld') });
  if (ui.tripped) chips.push({ color: '#ff5a3c', text: L('Istič vypadol', 'Breaker tripped') });
  const overlay = (<>
    {ui.helmet && (
      <div className={`helmet ${ui.helmetType}`}>
        <div ref={glassRef} className="helmet-glass" />
        <div className="helmet-tag">{ui.helmetType === 'auto'
          ? `${L('Samostmievacia kukla', 'Auto-darkening helmet')} · DIN ${ui.shade} · ${fmt(ui.adfDelay)} s · ${L('H zdvihne', 'H lifts')}`
          : L('Stará kukla · pevné sklo DIN 11 · H zdvihne', 'Old helmet · fixed DIN 11 glass · H lifts')}</div>
      </div>
    )}
    <div ref={flashRef} className="flash" />
  </>);

  return (
    <div className="machine-app w-full flex flex-col md:flex-row">
      <SceneView mountRef={mountRef} layerRef={layerRef} tipRef={tipRef} ui={ui} set={set} parts={parts} selected={selected} selectPart={selectPart} chips={chips} onBack={onBack} apiRef={apiRef}
        workLabels={[L('Prezrieť si zvarenec', 'Inspect the weldment'), L('Vrátiť na stôl', 'Back to the table')]} overlay={overlay}
        manualLabel={L('Zváranie', 'Welding')}
        tools={<>
          <button type="button" className={`scene-btn ${ui.helmet ? 'on' : ''}`} aria-pressed={ui.helmet} onClick={() => set('helmet', !ui.helmet)} title="H">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinejoin="round" aria-hidden="true"><path d="M5 10a7 7 0 0 1 14 0v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" /><path d="M8 11h8v4H8z" /></svg>
            {ui.helmet ? L('Kukla spustená', 'Helmet down') : L('Kukla zdvihnutá', 'Helmet up')}
          </button>
          <button type="button" className="scene-btn" disabled={!ui.slag || ui.unclamped} style={{ opacity: ui.slag ? 1 : 0.5 }} onClick={() => { if (apiRef.current.chip && apiRef.current.chip()) set('slag', false); }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M14 4l6 6-3 3-6-6zM11 7l-7 7 3 3 7-7" /></svg>
            {L('Otĺcť trosku', 'Chip slag')}
          </button>
        </>}
        hint={L('Ťahaj: otáčanie · pravé tlačidlo: posun · koliesko: zoom · M: režim Zváranie · H: kukla', 'Drag: orbit · right button: pan · wheel: zoom · M: welding mode · H: helmet')}
        manualHint={<><b className="ink">{L('Zváranie:', 'Welding:')}</b> {L('drž pravé tlačidlo a veď elektródu, ľavým pri držanom pravom zapáliš oblúk, koliesko s pravým mení dĺžku oblúka. Na dotyku 1 prst vedie, 2 prsty zvárajú. Kameru vráti M alebo Esc.', 'hold the right button to guide the electrode, press the left one as well to strike the arc, the wheel with the right button sets the arc length. On touch 1 finger guides, 2 fingers weld. M or Esc returns to the camera.')}</>} />
      <aside className="panel">
        <PanelHeader ui={ui} set={set} kicker={L('Simulátor · zváranie', 'Simulator · welding')} title={L('Oblúková zváračka', 'Arc welder')}
          sub={L('Predloha: transformátorová zváračka Elektrokov JS 90FN, ručné zváranie obalenou elektródou (MMA).', 'Modelled after the Elektrokov JS 90FN transformer welder, manual metal arc welding (MMA).')}
          rows={[[L('Prúd A', 'Current A'), String(tele.I)], [L('Oblúk mm', 'Arc mm'), tele.la.toFixed(1)], [L('Posuv mm/s', 'Travel mm/s'), tele.v.toFixed(1)]]}
          foot={[`Ø${ui.de} ${ui.etype === 'rutile' ? 'E 6013' : 'E 7018'}`, `${L('elektróda', 'electrode')} ${Math.round(tele.le)} mm`]} status={statusMsg} />

        <div className="sec">
          <h3 className="sec-title mb-2">{L('Zváračka', 'Welder')}</h3>
          <SegRow label={L('Prepínač', 'Switch')} value={ui.mode} options={[['off', '0'], ['w380', '380 V'], ['w220', '220 V'], ['charge', L('Nabíjanie', 'Charging')]]} onChange={(v) => set('mode', v)} />
          <div className="text-sm font-semibold mb-1">{L('Zvárací prúd', 'Welding current')}</div>
          <div className="flex flex-wrap gap-1.5 mb-2">
            {WELD_DIAL.map((a) => <button key={a} type="button" className={`btn ${ui.current === a ? 'active' : ''}`} aria-pressed={ui.current === a} onClick={() => set('current', a)}>{a} A</button>)}
          </div>
          <Toggle on={ui.ground} label={L('Zemniaca svorka pripojená', 'Ground clamp attached')} onClick={() => set('ground', !ui.ground)} />
          {ui.tripped && <button type="button" className="btn w-full mt-2" onClick={() => set('tripped', false)}>{L('Zapnúť istič', 'Reset the breaker')}</button>}
          <p className="text-xs muted mt-2">{L('Pri 220 V je dovolený prúd najviac 75 A – inak istič vypadne.', 'On 220 V the current is limited to 75 A – otherwise the breaker trips.')}</p>
        </div>

        <div className="sec">
          <h3 className="sec-title mb-2">{L('Elektróda', 'Electrode')}</h3>
          <SegRow label={L('Druh', 'Type')} value={ui.etype} options={Object.entries(ELECTRODES).map(([k, e]) => [k, L(e.sk, e.en)])}
            onChange={(v) => { set('etype', v); if (!ELECTRODES[v].r[ui.de]) set('de', 3.2); }} />
          <SegRow label={L('Priemer', 'Diameter')} value={ui.de} options={Object.keys(ELECTRODES[ui.etype].r).map(Number).sort((a, b) => a - b).map((d) => [d, `Ø${L(String(d).replace('.', ','), String(d))}`])} onChange={(v) => set('de', v)} />
          <p className="text-xs muted mb-2">{L(`Odporúčaný prúd pre Ø${ui.de}: ${lo} – ${hi} A. Dĺžka oblúka ≈ priemer elektródy.`, `Recommended current for Ø${ui.de}: ${lo} – ${hi} A. Arc length ≈ electrode diameter.`)}</p>
          <Slider id="wla" label={L('Dĺžka oblúka (výška elektródy)', 'Arc length (electrode height)')} unit="mm" min={0} max={12} step={0.5} value={ui.arcLen} digits={1} onChange={(v) => set('arcLen', v)} />
          <Slider id="whv" label={L('Najvyššia rýchlosť ruky pri zváraní', 'Max hand speed while welding')} unit="mm/s" min={1} max={20} step={0.5} value={ui.handV} digits={1} onChange={(v) => set('handV', v)} />
          <Toggle on={ui.autoArc} label={L('Ruka dorovnáva opaľovanie elektródy', 'Hand compensates electrode burn-off')} onClick={() => set('autoArc', !ui.autoArc)} />
          <p className="text-xs muted mt-1">{L('Elektróda ide za kurzorom (modrý krúžok) najviac touto rýchlosťou – bežne 2 – 6 mm/s. Pomalší posuv dá širšiu a vyššiu húsenicu.', 'The electrode follows the cursor (blue ring) at most at this speed – typically 2 – 6 mm/s. Slower travel gives a wider, higher bead.')}</p>
          <button type="button" className="btn w-full mt-2" onClick={() => apiRef.current.newElectrode && apiRef.current.newElectrode()}>{L('Vložiť novú elektródu', 'Fit a new electrode')}</button>
        </div>

        <div className="sec">
          <h3 className="sec-title mb-2">{L('Zvar a polotovar', 'Joint and parts')}</h3>
          <div className="grid grid-cols-5 gap-1.5 mb-3">
            {WELD_TYPES.map((w) => (
              <button key={w.id} type="button" className={`weld-type ${ui.wType === w.id ? 'on' : ''}`} aria-pressed={ui.wType === w.id} onClick={() => set('wType', w.id)} title={L(w.sk, w.en)}>
                <svg viewBox="0 0 30 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={w.sym} /></svg>
                {L(w.sk, w.en)}
              </button>
            ))}
          </div>
          <div className="text-sm font-semibold mb-1">{L('Poloha zvárania', 'Welding position')}</div>
          <div className="grid grid-cols-2 gap-1.5 mb-1.5">
            {WELD_POS.map(([k, code, sk, en]) => (
              <button key={k} type="button" className={`tool-slot ${ui.wPos === k ? 'on' : ''}`} aria-pressed={ui.wPos === k} onClick={() => set('wPos', k)}>
                <b>{k} · {code}</b>{L(sk, en)}
              </button>
            ))}
          </div>
          <div className="flex flex-wrap gap-1.5 mb-1">
            {WELD_POS_PIPE.map(([k, code]) => <button key={k} type="button" className="btn" disabled title={L('Rúrové polohy – pripravujeme', 'Pipe positions – coming soon')} style={{ opacity: 0.5 }}>{k} · {code}</button>)}
          </div>
          <p className="text-xs muted mb-3">{L('Rúrové polohy PH, PJ a H-L045 pripravujeme.', 'Pipe positions PH, PJ and H-L045 are coming soon.')}{FILLETS.includes(ui.wType) && ui.wPos === 'PC' ? ` ${L('PC je poloha pre tupé zvary.', 'PC is a butt-weld position.')}` : ''}{!FILLETS.includes(ui.wType) && (ui.wPos === 'PB' || ui.wPos === 'PD') ? ` ${L('PB a PD sú polohy pre kútové zvary.', 'PB and PD are fillet-weld positions.')}` : ''}</p>
          <Slider id="wt" label={L('Hrúbka plechu', 'Plate thickness')} unit="mm" min={1} max={30} step={1} value={ui.wT} onChange={(v) => set('wT', v)} />
          <Slider id="wl" label={L('Dĺžka zvaru', 'Weld length')} unit="mm" min={80} max={250} step={10} value={ui.wL} onChange={(v) => set('wL', v)} />
          <div className="desc" style={{ marginTop: 0 }}>
            <div className="font-semibold mb-1">{L('Zvarová príprava', 'Joint preparation')}: {L(wt.sk, wt.en)}</div>
            <div>{prepText}</div>
            {groove > 1 && <div className="mt-1">{L(`Odhad: ${groove} húseníc pri ${ui.current} A.`, `Estimate: ${groove} passes at ${ui.current} A.`)}</div>}
            {thWarn && <div className="mt-1" style={{ color: 'var(--warn)' }}>{L(`Tento druh zvaru sa používa pre hrúbky ${wt.t[0]} – ${wt.t[1]} mm.`, `This joint is used for thicknesses ${wt.t[0]} – ${wt.t[1]} mm.`)}</div>}
          </div>
          <button type="button" className="btn w-full mt-2" onClick={() => apiRef.current.newParts && apiRef.current.newParts()}>{L('Pripraviť nové diely', 'Prepare new parts')}</button>
        </div>

        <div className="sec">
          <h3 className="sec-title mb-2">{L('Ochrana', 'Protection')}</h3>
          <SegRow label={L('Kukla', 'Helmet')} value={ui.helmetType} options={[['auto', L('Moderná (senzor)', 'Modern (sensor)')], ['old', L('Stará (pevné sklo)', 'Old (fixed glass)')]]} onChange={(v) => set('helmetType', v)} />
          <Toggle on={ui.helmet} label={L('Zváračská kukla spustená (H)', 'Welding helmet down (H)')} onClick={() => set('helmet', !ui.helmet)} />
          {ui.helmetType === 'auto' ? (<div className="mt-2">
            <Slider id="wsh" label={L('Stupeň stmavenia', 'Shade')} unit="DIN" min={9} max={13} step={1} value={ui.shade} onChange={(v) => set('shade', v)} />
            <Slider id="wdl" label={L('Oneskorenie zosvetlenia', 'Light-state delay')} unit="s" min={0.1} max={1} step={0.1} value={ui.adfDelay} digits={1} onChange={(v) => set('adfDelay', v)} />
            <p className="text-xs muted">{L('Senzory zachytia oblúk a sklo okamžite stmavne; bez oblúka je priehľadné, takže vidíš, kam priložíš elektródu.', 'The sensors detect the arc and the glass darkens instantly; without the arc it is clear, so you see where to place the electrode.')}</p>
          </div>) : <p className="text-xs muted mt-2">{L('Pevné tmavé sklo DIN 11 – bez oblúka cez neho takmer nič nevidno, elektródu treba priložiť naslepo.', 'Fixed dark DIN 11 glass – without the arc you can hardly see anything, the electrode has to be placed blind.')}</p>}
          <p className="text-xs muted mt-2">{L(`Bez kukly oblúk oslňuje celú obrazovku. Záblesky bez kukly: ${tele.flashes || 0}.`, `Without the helmet the arc blinds the whole screen. Flashes without helmet: ${tele.flashes || 0}.`)}</p>
        </div>

        <div className="sec">
          <h3 className="sec-title mb-2">{L('Hodnotenie zvaru', 'Weld assessment')}</h3>
          {s ? (<div className="text-sm" style={{ lineHeight: 1.6 }}>
            <div>{L('Zvarená dĺžka', 'Welded length')}: <b>{Math.round(s.cov * 100)} %</b></div>
            {s.fill != null && <div>{L('Vyplnenie úkosu', 'Groove filled')}: <b>{Math.round(s.fill * 100)} %</b></div>}
            <div>{L('Šírka húsenice', 'Bead width')}: <b>{fmt(s.width)} mm</b> · {L('prevýšenie', 'reinforcement')}: <b>{fmt(s.reinf)} mm</b></div>
            <div>{L('Rozstrek', 'Spatter')}: <b>{s.spat}</b></div>
            <div className="mt-1" style={{ color: defects.length ? 'var(--warn)' : 'var(--accent)' }}>{defects.length ? `${L('Chyby', 'Defects')}: ${defects.join(', ')}.` : L('Bez zjavných chýb.', 'No obvious defects.')}</div>
          </div>) : <p className="text-sm muted">{L('Zatiaľ nie je nič zvarené.', 'Nothing welded yet.')}</p>}
          <button type="button" className="btn w-full mt-2" disabled={!ui.slag} onClick={() => { if (apiRef.current.chip && apiRef.current.chip()) set('slag', false); }}>{L('Otĺcť trosku', 'Chip off the slag')}</button>
        </div>

        <ViewSection apiRef={apiRef} views={[['detail', L('Detail spoja', 'Joint detail')], ['zhora', L('Zhora', 'Top')], ['celok', L('Celok', 'Overview')], ['zvaracka', L('Zváračka', 'Welder')]]} />
        <PartsSection parts={parts} selected={selected} selectPart={selectPart} />
        <HelpFooter />
      </aside>
    </div>
  );
}

function App() {
  const readRoute = () => { try { return (window.location.hash || '').replace('#', ''); } catch (err) { return ''; } };
  const [route, setRoute] = useState(readRoute);
  const [prefs, setPrefs] = useState({ ...PREFS });
  const setPref = (k, v) => {
    PREFS[k] = v; const n = { ...PREFS }; setPrefs(n);
    try { localStorage.setItem('rmt-prefs', JSON.stringify(n)); } catch (err) { /* bez uloženia */ }
    try { document.documentElement.dataset.skin = n.skin; document.documentElement.lang = n.lang; } catch (err) { /* ignorované */ }
  };
  useEffect(() => {
    const sync = () => setRoute(readRoute());
    window.addEventListener('hashchange', sync); window.addEventListener('popstate', sync);
    return () => { window.removeEventListener('hashchange', sync); window.removeEventListener('popstate', sync); };
  }, []);
  useEffect(() => { document.title = L('Simulátory obrábacích strojov', 'Machine tool simulators'); }, [prefs.lang]);
  const go = (id) => {
    setRoute(id);
    try {
      if (id) window.location.hash = id;
      else window.history.pushState('', document.title, window.location.pathname + window.location.search);
    } catch (err) { /* ignorované */ }
    window.scrollTo(0, 0);
  };
  const m = MACHINES.find((x) => x.id === route);
  return (
    <PrefsCtx.Provider value={{ prefs, setPref }}>
      <style>{CSS}</style>
      {m ? <m.Comp key={m.id} lang={prefs.lang} onBack={() => go('')} /> : <Menu onOpen={go} />}
    </PrefsCtx.Provider>
  );
}
